# This workflow will build a golang project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-go

name: Go 

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22.0'
          cache: true

      - name: Build
        run: go build -v ./...

      - name: Build example sub-modules
        run: make examples

      - name: Verify example generated files are up to date
        run: |
          if ! git diff --exit-code example/; then
            echo "::error::example/ generated files differ from committed output. Run 'make examples' and commit the diff."
            exit 1
          fi

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22.0'
          cache: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest 
          args: --timeout=5m
